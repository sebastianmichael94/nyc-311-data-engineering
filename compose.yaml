services:
  postgres:
    image: postgres:17
    container_name: nyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nyc_311
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d nyc_311"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
